<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roblox Throw a Coin — Collection Index Tracker</title>
  
  <!-- ✨ 效能優化：預先連線外部資源，加速 DNS 解析與交握 -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://i.ibb.co" crossorigin>
  <link rel="dns-prefetch" href="https://www.gstatic.com">
  <link rel="dns-prefetch" href="https://i.ibb.co">

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --header-bg: #0f172a;
      --table-header-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --success-bg: rgba(16, 185, 129, 0.15);
      --success-text: #34d399;
      --success-border: #10b981;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 24px;
    }

    .update-banner {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 6px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 16px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 6px;
    }
    .update-banner span {
      color: var(--success-text);
      font-weight: 600;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .avatar-wrapper {
      position: relative;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, #818cf8, #c084fc, #f43f5e, #fde047, #38bdf8);
      background-size: 300% 300%;
      animation: avatarGradient 4s linear infinite, avatarGlow 2.5s ease-in-out infinite alternate;
      flex-shrink: 0;
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      background-color: #0f172a;
      display: block;
    }

    @keyframes avatarGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes avatarGlow {
      0% {
        box-shadow: 0 0 8px rgba(129, 140, 248, 0.6), 0 0 15px rgba(192, 132, 252, 0.4);
        transform: scale(1);
      }
      100% {
        box-shadow: 0 0 18px rgba(244, 63, 94, 0.8), 0 0 28px rgba(56, 189, 248, 0.6);
        transform: scale(1.04);
      }
    }

    .title-group h1 {
      margin: 0;
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      background: linear-gradient(120deg, #818cf8 0%, #c084fc 25%, #f43f5e 50%, #fde047 75%, #38bdf8 100%);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: titleGradientFlow 6s ease infinite, titleGlowPulse 2.5s ease-in-out infinite alternate;
      position: relative;
      display: inline-block;
    }

    @keyframes titleGradientFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes titleGlowPulse {
      0% {
        filter: drop-shadow(0 0 5px rgba(129, 140, 248, 0.4)) drop-shadow(0 0 12px rgba(192, 132, 252, 0.3));
      }
      100% {
        filter: drop-shadow(0 0 12px rgba(244, 63, 94, 0.7)) drop-shadow(0 0 25px rgba(56, 189, 248, 0.6)) drop-shadow(0 0 35px rgba(253, 224, 71, 0.4));
      }
    }

    .auth-box {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card-bg);
      padding: 8px 16px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .auth-status {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .btn {
      background-color: var(--accent);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.875rem;
      transition: all 0.2s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover { background-color: var(--accent-hover); }
    .btn-secondary { background-color: #334155; }
    .btn-secondary:hover { background-color: #475569; }
    .btn-warning { background-color: #eab308; color: #0f172a; }
    .btn-warning:hover { background-color: #ca8a04; }
    .btn-danger { background-color: #ef4444; }
    .btn-danger:hover { background-color: #dc2626; }
    .btn-success { background-color: #10b981; color: #fff; }
    .btn-success:hover { background-color: #059669; }

    .btn-roblox {
      background: linear-gradient(135deg, #00a2ff, #0066ff);
      color: #fff;
    }
    .btn-roblox:hover {
      background: linear-gradient(135deg, #0088cc, #0044cc);
      box-shadow: 0 0 12px rgba(0, 162, 255, 0.5);
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px 20px;
    }

    .stat-title {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .toolbar {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
      align-items: center;
    }

    .search-input {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      flex: 1;
      min-width: 200px;
    }
    .search-input:focus { border-color: var(--accent); }

    .view-toggle-container {
      display: flex;
      gap: 6px;
      background: var(--card-bg);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
    }

    .view-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 600;
      transition: all 0.2s;
    }

    .view-btn.active {
      background: var(--accent);
      color: #fff;
    }

    .admin-only {
      display: none;
    }

    body:not(.read-only) .admin-only {
      display: inline-flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .table-container {
      overflow-x: auto;
      background-color: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      max-height: 75vh;
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      text-align: left;
    }

    th {
      position: sticky;
      top: 0;
      background-color: #1e293b;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-color);
      z-index: 10;
    }

    td {
      padding: 8px 16px;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.95rem;
      color: var(--text-main);
      vertical-align: middle;
    }

    tr:hover td {
      background-color: rgba(255, 255, 255, 0.03);
    }

    .item-img-container {
      width: 72px;
      height: 72px;
      border-radius: 10px;
      background: #0f172a;
      border: 1px dashed var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
      position: relative;
    }

    .item-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: transform 0.2s ease-in-out;
    }

    .item-img-container:hover .item-img {
      transform: scale(1.4);
      z-index: 20;
    }

    .img-placeholder {
      font-size: 0.8rem;
      color: #475569;
      text-align: center;
    }

    body:not(.read-only) .editable-cell:hover {
      background-color: rgba(99, 102, 241, 0.15);
      cursor: pointer;
    }

    .rarity-tag {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      text-transform: capitalize;
    }

    /* 稀有度顏色省略（保留原樣式） */
    .rarity-common { color: #9e9e9e; background: rgba(158, 158, 158, 0.15); border: 1px solid #616161; }
    .rarity-legendary { color: #ffa726; background: rgba(255, 167, 38, 0.15); border: 1px solid #f57c00; }
    .rarity-mythic, .rarity-mythical { color: #ef5350; background: rgba(239, 83, 80, 0.15); border: 1px solid #d32f2f; }
    .rarity-godly, .rarity-godlike { color: #ffd700; background: rgba(255, 215, 0, 0.25); border: 1px solid #ffaa00; }

    .status-cell {
      text-align: center;
      cursor: pointer;
      user-select: none;
    }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .badge-empty { color: #475569; }
    .badge-collected {
      background-color: var(--success-bg);
      color: var(--success-text);
      border: 1px solid var(--success-border);
    }

    .count-box {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .count-btn {
      background: #334155;
      color: #fff;
      border: none;
      width: 22px;
      height: 22px;
      border-radius: 4px;
      cursor: pointer;
      display: none;
      font-weight: bold;
    }

    body:not(.read-only) .count-box:hover .count-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
      gap: 18px;
      padding: 4px 0;
    }

    .item-card {
      position: relative;
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
    }

    .card-img-wrapper {
      position: relative;
      width: 100%;
      height: 105px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      border-radius: 8px;
      margin: 8px 0;
    }

    .card-img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease-in-out;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .trade-modal {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      width: 90%;
      max-width: 650px;
      padding: 24px;
    }

    .trade-textarea {
      width: 100%;
      height: 220px;
      background: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: #38bdf8;
      font-family: monospace;
      padding: 12px;
      margin-bottom: 16px;
      resize: vertical;
    }
  </style>
</head>
<body class="read-only">

  <div class="update-banner">
    上次更新時間：<span id="last-updated-time">載入中...</span>
  </div>

  <header>
    <div class="title-group">
      <div class="avatar-wrapper">
        <!-- ⚡ 最佳化：加入 width、height 與 fetchpriority 讓首屏頭像優先載入 -->
        <img src="https://i.ibb.co/vv6Dd3qw/test22.png" alt="Avatar" class="avatar-img" width="58" height="58" fetchpriority="high">
      </div>
      <h1>新竹九降風清水疾風俠 Roblox Throw a Coin — Collection Index Tracker</h1>
    </div>
    <div class="auth-box">
      <a href="https://www.roblox.com/users/10053396167/profile" target="_blank" rel="noopener noreferrer" class="btn btn-roblox">🎮 Roblox</a>
      <button class="btn btn-secondary" onclick="copyRobloxID()">📋 複製 ID</button>
      <button id="trade-btn" class="btn btn-success admin-only">🤝 交易助手</button>
      <span id="auth-status" class="auth-status">當前狀態：瀏覽模式 (唯讀)</span>
      <button id="auth-btn" class="btn">管理員登入</button>
    </div>
  </header>

  <div class="dashboard">
    <div class="stat-card">
      <div class="stat-title">Astral 收集進度</div>
      <div id="stat-astral" class="stat-value">0 / 188 (0%)</div>
    </div>
    <div class="stat-card">
      <div class="stat-title">Divine 收集進度</div>
      <div id="stat-divine" class="stat-value">0 / 188 (0%)</div>
    </div>
    <div class="stat-card">
      <div class="stat-title">Void 收集進度</div>
      <div id="stat-void" class="stat-value">0 / 188 (0%)</div>
    </div>
    <div class="stat-card">
      <div class="stat-title">Astral 總數量</div>
      <div id="stat-count-total" class="stat-value">0</div>
    </div>
  </div>

  <div class="toolbar">
    <!-- ⚡ 搜尋列加入防抖機制 -->
    <input type="text" id="search-input" class="search-input" placeholder="搜尋物品名稱或編號...">
    
    <div class="view-toggle-container">
      <button id="btn-view-table" class="view-btn active">📊 表格</button>
      <button id="btn-view-card" class="view-btn">🎴 卡牌相簿</button>
    </div>

    <div class="admin-only">
      <button id="add-item-btn" class="btn btn-success">➕ 新增物品 (列)</button>
      <button id="delete-item-btn" class="btn btn-danger">🗑️ 刪除最後一列</button>
      <button id="add-col-btn" class="btn btn-warning">➕ 新增欄位 (欄)</button>
      <button id="del-col-btn" class="btn btn-danger">🗑️ 刪除自訂欄位</button>
      <button id="export-csv-btn" class="btn btn-secondary">📥 匯出 CSV</button>
      <button id="export-json-btn" class="btn btn-secondary">💾 備份 JSON</button>
      <button id="import-btn" class="btn btn-warning">📤 匯入 JSON 備份</button>
      <input type="file" id="import-file-input" accept=".json" style="display: none;">
    </div>
  </div>

  <div id="table-view-container" class="table-container">
    <table>
      <thead>
        <tr id="table-header-row">
          <th style="width: 70px;">編號</th>
          <th style="width: 140px;">物品名稱</th>
          <th style="width: 100px;">圖片</th>
          <th style="width: 130px;">稀有度</th>
          <th style="width: 120px; text-align: center;">ASTRAL</th>
          <th style="width: 130px; text-align: center;">ASTRAL COUNT</th>
          <th style="width: 120px; text-align: center;">DIVINE</th>
          <th style="width: 120px; text-align: center;">VOID</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>

  <div id="card-view-container" class="card-grid" style="display: none;"></div>

  <div id="trade-modal-overlay" class="modal-overlay">
    <div class="trade-modal">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h2>🤝 Discord 交易格式產生器</h2>
        <button id="modal-close-btn" style="background:none;border:none;color:#fff;font-size:1.5rem;cursor:pointer;">&times;</button>
      </div>
      <textarea id="trade-text-output" class="trade-textarea" readonly></textarea>
      <div style="display: flex; justify-content: flex-end;">
        <button id="copy-trade-btn" class="btn btn-success">📋 複製 Discord 文字</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBh4wNEwXzGOxKOJqj3Akg7gj1WxFHzmNQ",
      authDomain: "throw-a-coin.firebaseapp.com",
      projectId: "throw-a-coin",
      storageBucket: "throw-a-coin.firebasestorage.app",
      messagingSenderId: "79225369395",
      appId: "1:79225369395:web:ac6b6dadb1154159c40446",
      measurementId: "G-B84NLZX6Z8"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let customColumns = [];
    let lastUpdatedTime = "尚無記錄";
    let itemsData = {};
    const TOTAL_ITEMS = 188;

    for (let i = 1; i <= TOTAL_ITEMS; i++) {
      itemsData[`item_${i}`] = {
        id: i,
        name: `物品 #${i}`,
        rarity: "Common",
        imageUrl: "",
        astral: false,
        astralCount: 0,
        divine: false,
        void: false,
        extraFields: {}
      };
    }

    const tbody = document.getElementById("table-body");
    const cardContainer = document.getElementById("card-view-container");
    const tableViewContainer = document.getElementById("table-view-container");
    const searchInput = document.getElementById("search-input");
    const lastUpdatedTimeSpan = document.getElementById("last-updated-time");

    function render() {
      const query = searchInput.value.toLowerCase().trim();
      tbody.innerHTML = "";
      cardContainer.innerHTML = "";

      let astralCountSum = 0, astralCollected = 0, divineCollected = 0, voidCollected = 0;
      const sortedKeys = Object.keys(itemsData).sort((a, b) => itemsData[a].id - itemsData[b].id);

      sortedKeys.forEach(key => {
        const item = itemsData[key];
        if (item.astral) astralCollected++;
        if (item.divine) divineCollected++;
        if (item.void) voidCollected++;
        astralCountSum += (item.astralCount || 0);

        if (!item.name.toLowerCase().includes(query) && !String(item.id).includes(query)) return;

        const safeRarityName = item.rarity ? item.rarity.toLowerCase().replace(/[^a-z0-9]/g, '') : 'common';
        const isUnlocked = item.astral || item.divine || item.void || (item.astralCount > 0);

        // 表格列渲染 (⚡ 圖片加上 loading="lazy" 延遲載入)
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><strong>#${item.id}</strong></td>
          <td><strong>${item.name}</strong></td>
          <td>
            <div class="item-img-container">
              ${item.imageUrl ? `<img src="${item.imageUrl}" class="item-img" alt="${item.name}" loading="lazy" width="72" height="72">` : `<span class="img-placeholder">+圖片</span>`}
            </div>
          </td>
          <td><span class="rarity-tag rarity-${safeRarityName}">${item.rarity}</span></td>
          <td class="status-cell"><span class="badge ${item.astral ? 'badge-collected' : 'badge-empty'}">${item.astral ? '✓' : '-'}</span></td>
          <td class="status-cell">${item.astralCount || 0}</td>
          <td class="status-cell"><span class="badge ${item.divine ? 'badge-collected' : 'badge-empty'}">${item.divine ? '✓' : '-'}</span></td>
          <td class="status-cell"><span class="badge ${item.void ? 'badge-collected' : 'badge-empty'}">${item.void ? '✓' : '-'}</span></td>
        `;
        tbody.appendChild(tr);

        // 卡牌檢視渲染 (⚡ 圖片加上 loading="lazy")
        const card = document.createElement("div");
        card.className = `item-card ${isUnlocked ? 'unlocked' : 'locked'}`;
        card.innerHTML = `
          <div style="font-size:0.75rem; color:#94a3b8;">#${item.id}</div>
          <div class="card-img-wrapper">
            ${item.imageUrl ? `<img src="${item.imageUrl}" class="card-img" alt="${item.name}" loading="lazy" width="90" height="90">` : `<span>❓</span>`}
          </div>
          <div style="font-weight:700;">${item.name}</div>
          <span class="rarity-tag rarity-${safeRarityName}">${item.rarity}</span>
        `;
        cardContainer.appendChild(card);
      });

      document.getElementById("stat-astral").innerText = `${astralCollected} / ${sortedKeys.length} (${Math.round((astralCollected / sortedKeys.length) * 100 || 0)}%)`;
      document.getElementById("stat-divine").innerText = `${divineCollected} / ${sortedKeys.length} (${Math.round((divineCollected / sortedKeys.length) * 100 || 0)}%)`;
      document.getElementById("stat-void").innerText = `${voidCollected} / ${sortedKeys.length} (${Math.round((voidCollected / sortedKeys.length) * 100 || 0)}%)`;
      document.getElementById("stat-count-total").innerText = astralCountSum;
      lastUpdatedTimeSpan.innerText = lastUpdatedTime;
    }

    // ⚡ 搜尋欄防抖實作 (Debounce)
    let debounceTimer;
    searchInput.oninput = () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => render(), 200);
    };

    onSnapshot(doc(db, "tracker", "progress"), (docSnap) => {
      if (docSnap.exists()) {
        const data = docSnap.data();
        if (data.items) itemsData = data.items;
        if (data.customColumns) customColumns = data.customColumns;
        if (data.lastUpdated) lastUpdatedTime = data.lastUpdated;
        render();
      }
    });

    render();
  </script>
</body>
</html>
